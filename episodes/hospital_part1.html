 else if(n==='walk')hallway(t,{callOn:true,door13:lerp(0.2,0.4,p),hero:true,walk:true,heroX:lerp(420,700,p),heroY:lerp(1880,1640,p),heroS:lerp(1.3,1.0,p),heroO:{mood:'scared',turn:0.6,light:-10},beam:15,dark:0.62,holes:[[860,720,200]]});
