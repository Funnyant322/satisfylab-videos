// ZOMBIE BUNKER Part 2 (BLOCK IT won). Hook: a page slid under the door.
window.HI={gold:['page','m','radio','handwriting','note','please'],red:['knocking','knocked','knock','loud','door','shakes','silence','never','trust']};
const S=[[0,3.9,'hook'],[3.9,5.8,'rewind'],[5.8,11.1,'knock'],[11.1,12.9,'clock'],[12.9,14.8,'cot'],[14.8,15.9,'shelf'],[15.9,18.0,'crates'],
 [18.0,21.3,'cans'],[21.3,24.0,'rule2'],[24.0,26.6,'back'],[26.6,29.3,'knocks'],[29.3,31.2,'shakes'],[31.2,33.7,'silence'],[33.7,36.6,'page'],
 [36.6,38.7,'hand'],[38.7,45.0,'rule4'],[45.0,49.6,'rule3'],[49.6,55.4,'radio'],[55.4,60.4,'behind'],[60.4,63.8,'please'],[63.8,68.4,'vote']];
const CLK=t=>t<3.9?['8:41','PM']:t<12.9?['8:13','PM']:t<24?['8:19','PM']:t<33.7?['8:31','PM']:t<49.6?['8:40','PM']:t<55.4?['8:44','PM']:['8:46','PM'];
const PLACE=t=>'ZOMBIE BUNKER · '+(t<3.9||(t>=33.7&&t<36.6)||(t>=55.4&&t<60.4)?'BACK DOOR':'MAIN ROOM');
const NOISE=t=>(t>=12.9&&t<21.3)||(t>=26.6&&t<31.2)?['NOISE: TOO LOUD','#ff5a4a']:['NOISE: QUIET','#7be08a'];

const PAGE=[['4. Three knocks',1,66],['means it\'s me.',1,66],['Open the door.',0,66],['— M.',0,60]];
window.renderFrame=function(t){const sh=S.find(s=>t>=s[0]&&t<s[1])||S[S.length-1];const n=sh[2],dt=t-sh[0],p=dt/(sh[1]-sh[0]);
 x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,W,H);x.save();

 else if(n==='clock')room({hero:[520,1640,1.3],heroO:{mood:'worry',look:0.3}});
 else if(['cot','shelf','crates'].includes(n)){const st=n==='cot'?ease(p):n==='shelf'?1+ease(p):2+ease(p);
  bunkerRoom(t,{hero:[n==='cot'?lerp(220,300,ease(p)):n==='shelf'?880:200,1640,1.2],heroO:{mood:'scared',arm:'point',walk:t,look:n==='shelf'?-1:1},holes:[[540,1150,520]]});barricade(t,st);}

 else if(n==='shakes'){bunkerRoom(t,{knock:true,dark:0.55,swing:14});barricade(t,3,{shake:1});}
 else if(n==='silence'){bunkerRoom(t,{dark:0.8,swing:2});barricade(t,3);}
 else if(n==='page')doorGap(t,clamp(dt/2.2),{dark:0.5});
 else if(n==='hand')tornPage(t,PAGE,0.6+dt*0.3,{});
 else if(n==='rule4')tornPage(t,PAGE,1+clamp((dt-0.2)/1.4)+clamp((dt-3.4)/0.6)+clamp((dt-4.8)/0.6),{});
 else if(n==='rule3')ruleNote(t,RULES3,3,{});

 else if(n==='please')tornPage(t,PAGE.concat([['Please.',1,110]]),4+clamp((dt-2.0)/0.4),{red:dt>2.2?0.25:0});
 else if(n==='vote'){bunkerRoom(t,{eyes:true,dark:0.6,swing:10,radioOn:true});barricade(t,3,{shake:Math.max(0,Math.sin(t*2))>0.9?0.6:0});}
 x.restore();
 if(n==='hook'||n==='knocks'||(n==='please'&&dt>2.2))flashRed(n==='please'?dt-2.2:dt,0.45);
 if(n==='rewind'){x.fillStyle='rgba(0,0,0,0.35)';x.fillRect(0,0,W,H);x.save();x.font='400 70px Anton';const w=x.measureText('◀◀  EARLIER TONIGHT').width+60;rr(540-w/2,880,w,110,12,'rgba(0,0,0,0.7)');txt('◀◀  EARLIER TONIGHT',540,960,'400 70px Anton','#fff');x.restore();}
 if(n==='silence'&&dt>0.4){x.save();x.globalAlpha=clamp((dt-0.4)/0.3);x.font='400 64px Anton';const w=x.measureText('SILENCE.').width+50;rr(540-w/2,700,w,96,10,'rgba(0,0,0,0.7)');txt('SILENCE.',540,770,'400 64px Anton','#fff');x.restore();}
 if(n==='vote')vote3('RADIO','OPEN DOOR',dt);
 const [tm,ap]=CLK(t);if(!['rule2','rule3','rule4','hand','please','radio'].includes(n))hud3({day:1,days:6,time:tm,ampm:ap,place:PLACE(t),chips:[['✓ HATCH: LOCKED','#7be08a'],NOISE(t)]});
 const spk=n==='radio'&&t>51.3?'RADIO · CH 3':(n==='rule4'||n==='hand'||n==='please')?"M.'S PAGE":null;
 if(n!=='vote')captions3(t,1580,spk);
 grainLite(t,0.05);cutFlash(dt);
};
